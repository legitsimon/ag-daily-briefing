    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
  async function open(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close()}
  async function tryStored(){var k=localStorage.getItem(LS);if(!k)return;
    try{var key=await crypto.subtle.importKey('raw',u8(k),'AES-GCM',false,['decrypt']);await open(key)}catch(e){localStorage.removeItem(LS)}}
  document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var b=document.getElementById('go'),er=document.getElementById('err');
    b.disabled=true;b.textContent='확인 중...';er.textContent='';
    try{var key=await derive(document.getElementById('pw').value);var raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
      var k2=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},k2,u8(CT));
      if(document.getElementById('rm').checked)localStorage.setItem(LS,b64(raw));
      await open(k2)}catch(err){er.textContent='비밀번호가 올바르지 않습니다.';b.disabled=false;b.textContent='열람하기'}});
  if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='이 브라우저에서는 열람할 수 없습니다(HTTPS 필요).'}else{tryStored()}
})();
</script>
